<!-- Начало галереи: 15 гусей, золотые «багетные» рамки, зум при наведении -->
<style>
  .gallery {
    padding: 20px;
    background-color: #f5f1e8; /* Тёплый бежевый фон */
    border-radius: 16px;
  }

  /* Стили для золотой рамки-багета */
  .gallery img {
    width: 100%;
    border-radius: 14px;
    
    /* Двойная рамка: золотая + светлая обводка для объёма */
    border: 4px solid #d4af37;       /* Золотой цвет */
    outline: 2px solid #f1e6bf;      /* Светлая обводка снаружи */
    
    /* Тень, имитирующая резьбу и глубину */
    box-shadow: 
      0 0 0 3px rgba(212, 175, 55, 0.4), 
      inset 0 0 15px rgba(0,0,0,0.1);
      
    display: block;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    z-index: 1;
  }

  /* Эффект при наведении: увеличение и усиление блеска */
  .gallery img:hover {
    transform: scale(1.12);
    cursor: zoom-in;
    filter: brightness(1.05);
    
    box-shadow: 
      0 0 0 5px rgba(212, 175, 55, 0.6), 
      inset 0 0 25px rgba(0,0,0,0.2);
  }
</style>
